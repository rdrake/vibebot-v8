site_name: VibeBot v8
site_url: https://rdrake.github.io/vibebot-v8/
repo_url: https://github.com/rdrake/vibebot-v8
repo_name: rdrake/vibebot-v8
docs_dir: docs/guide
strict: true

theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: light blue
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User Guide:
    - Getting Started: user/getting-started.md
    - AI Commands: user/ai-commands.md
    - Memory & Instructions: user/memory.md
    - Reminders & Usage: user/reminders-usage.md
    - Scheduled Tasks: user/scheduled-tasks.md
  - Plugins:
    - Overview: plugins/index.md
    - LLM: plugins/llm.md
    - RPG: plugins/rpg.md
    - NickInMiddle: plugins/nickinmiddle.md
  - Operator Guide:
    - Installation & Deployment: operator/installation.md
    - Operations & Auto-Updates: operator/operations.md
    - Configuration: operator/configuration.md
    - Forest Mode: operator/forest-mode.md
    - Spontaneous Participation: operator/spontaneous.md
    - Memory Promotion: operator/memory-promotion.md
    - Rate Limiting & Security: operator/rate-limiting-security.md
    - Tuning & Monitoring: operator/tuning-monitoring.md
    - Branch Protection: operator/branch-protection.md
  - Reference:
    - Command Reference: reference/commands.md
    - Bridge Tools: reference/bridge-tools.md

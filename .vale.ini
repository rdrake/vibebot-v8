StylesPath = styles
MinAlertLevel = suggestion

# Packages to sync (run: vale sync)
Packages = alex, write-good, RedHat, proselint

# Vocabularies
Vocab = OTU

# Skip code blocks
SkippedScopes = script, style, pre, code
IgnoredScopes = tt, code, strong, b

# Technical documentation
[*.{md,txt,rst,adoc}]
BasedOnStyles = OTU-Core, OTU-Recommended, alex, write-good, RedHat, proselint, Vale

# Canadian English spelling
Vale.Spelling = suggestion

TokenIgnores = \*\*(.*)\*\*, `(.*)`, \[.*\]\(.*\), {{.*}}, <.*>

# Tune rules
write-good.Passive = suggestion
RedHat.Spelling = suggestion

# Spelling dictionary
[Vale.Spelling]
dictionaries = en_CA
# Technical HPC terms in the OTU vocabulary are accepted
ignore = accept.txt

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "llm"
      - dependency-name: "nickinmiddle"
    groups:
      dev-tools:
        patterns:
          - "ruff"
          - "ty"
          - "prek"
          - "pytest*"
          - "mkdocs*"

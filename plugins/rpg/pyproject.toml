[project]
name = "rpg"
version = "0.1.0"
description = "Linux filesystem RPG for IRC"
requires-python = ">=3.12"
dependencies = [
    "limnoria>=2023.1.20",
    "litellm>=1.81.6",
    "d20>=1.1.0",
]

[project.entry-points."limnoria.plugins"]
RPG = "rpg"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpg"]

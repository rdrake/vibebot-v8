[project]
name = "llm"
version = "0.1.0"
description = "LiteLLM-powered AI commands for IRC bot"
requires-python = ">=3.12"
dependencies = [
    "limnoria>=2023.1.20",
    "litellm>=1.81.6",
    "aiohttp>=3.9.0",
    "markdown>=3.5.0",
    "pygments>=2.17.0",
    "nh3>=0.2.0",
]

[project.entry-points."limnoria.plugins"]
LLM = "llm"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm"]

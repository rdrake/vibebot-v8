[project]
name = "vibebot-v8"
version = "0.1.0"
description = "VibeBot v8 - Modern IRC bot with AI capabilities"
requires-python = ">=3.12"
dependencies = ["llm", "nickinmiddle", "rpg"]

[tool.uv.workspace]
members = ["plugins/llm", "plugins/nickinmiddle", "plugins/rpg"]

[tool.uv.sources]
llm = { workspace = true }
nickinmiddle = { workspace = true }
rpg = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["plugins/llm/tests", "plugins/nickinmiddle/tests", "plugins/rpg/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
filterwarnings = [
    "error",                            # Treat project warnings as test failures
    "ignore::SyntaxWarning",               # PEP 765: return-in-finally (supybot)
    "ignore::DeprecationWarning:litellm",  # asyncio.iscoroutinefunction (Python 3.16)
    "ignore::DeprecationWarning:supybot",  # currentThread(), codecs.open()
    "ignore::ResourceWarning:supybot",     # Unclosed conf/*.conf files
    "ignore::ResourceWarning:tempfile",    # HTTPError cleanup on Python 3.14
    "ignore::ResourceWarning:sqlite3",     # Thread-local connection pool cleanup
    "ignore::pytest.PytestUnraisableExceptionWarning",  # GC-triggered ResourceWarning from thread-local conns
    "ignore::SyntaxWarning:supybot",       # return-in-finally (PEP 765)
]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
unresolved-import = "ignore"  # External deps (supybot, litellm) not in workspace
unresolved-attribute = "ignore"  # Supybot has no type stubs

[tool.coverage.run]
source = ["plugins/llm/src", "plugins/nickinmiddle/src", "plugins/rpg/src"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "mkdocs-material>=9.6",
    "prek>=0.3.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.14.9",
    "ty>=0.0.1a34",
]
